[tools]
# Go version
go = "1.26"

# Node.js/Bun
bun = "1.3.14"

# Rust is managed by system rustup, not via mise
# rust = "stable"

# Other useful tools
jq = "latest"
tmux = "latest"
fzf = "latest"
make = "latest"
# git and wget: install via system package manager or aqua
# aqua:git = "latest"
# aqua:wget = "latest"

[tasks]
build = { run = "go build -o boite ." }
test = { run = "go test ./..." }
check = { run = "sh scripts/check.sh" }
fmt = { run = "sh scripts/check.sh --format" }

[env]
GO111MODULE = "on"
