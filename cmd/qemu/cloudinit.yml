#cloud-config
apt:
  sources:
    docker.list:
      source: https://download.docker.com/linux/debian/gpg
      keyid: 9DC858229FC7DD38854AE2D88D81807C1AAF0A5B
packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - git
  - curl
  - unzip
  - ca-certificates
  - bash-completion
  - fzf
  - jq
  - tmux
  - wget
  - make
  - build-essential
  - zsh
  - zsh-antigen
  - neovim
users:
  - name: boite
    gecos: Boite
    groups: [sudo, docker]
    shell: /usr/bin/zsh
    sudo: ALL=(ALL) NOPASSWD:ALL
    home: /home/boite
runcmd:
  - userdel -r ubuntu 2>/dev/null || rm -rf /home/ubuntu
  - chmod -x /etc/update-motd.d/* 2>/dev/null || true
  - rm -f /etc/legal /etc/motd
  - touch /home/boite/.hushlogin
  - |
    cat > /etc/motd << 'MOTD_EOF'
    ▄▄
    ██          ▀▀  ██
    ████▄ ▄███▄ ██ ▀██▀▀ ▄█▀█▄
    ██ ██ ██ ██ ██  ██   ██▄█▀
    ████▀ ▀███▀ ██▄ ██   ▀█▄▄▄

    v0.1.6
    MOTD_EOF
  - curl https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise sh
  - curl -L https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xzf -
  - su - boite -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
  - su - boite -c 'curl -fsSL https://bun.sh/install | bash'
  - su - boite -c 'curl -fsSL https://raw.githubusercontent.com/saravenpi/skatos/main/install.sh | bash'
  - su - boite -c 'git config --global init.defaultBranch main'
  - su - boite -c 'git config --global safe.directory "*"'
  - >
    su - boite -c
    'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" --unattended'
  - mkdir -p /workspace
  - chown -R boite:boite /workspace
  - |
    cat > /home/boite/.zshrc << 'EOF'
    export PATH="/usr/local/go/bin:$HOME/.cargo/bin:/usr/local/bin:$HOME/.local/bin:$HOME/.bun/bin:/workspace/bin:$PATH"

    if [ -d "$HOME/.oh-my-zsh" ]; then
      export ZSH="$HOME/.oh-my-zsh"
      ZSH_THEME="robbyrussell"
      plugins=(git sudo)
      [ -f "$ZSH/oh-my-zsh.sh" ] && source "$ZSH/oh-my-zsh.sh"
    fi

    if command -v mise >/dev/null 2>&1; then
      eval "$(mise activate zsh)"
    elif [ -x /usr/local/bin/mise ]; then
      eval "$(/usr/local/bin/mise activate zsh)"
    fi

    command -v starship >/dev/null 2>&1 && eval "$(starship init zsh)"

    alias ll='ls -la'
    alias lla='ls -la'
    alias lal='ls -la'
    alias la='ls -a'
    alias l='ls'
    alias ls='ls --color=auto'
    alias grep='grep --color=auto'

    alias c='clear'
    alias q='exit'
    alias :q='exit'
    alias ..='cd ..'
    alias ...='cd ../..'
    alias h='clear && cd $HOME'

    alias gs='git status'
    alias gp='git push'
    alias ga='git add'
    alias gc='git clone'
    alias gd='git diff'
    alias gb='git branch'
    alias gba='git branch -a'
    alias gco='git checkout'
    alias gr='git rm'
    alias gitu='git add . && git commit'
    alias gitup='git add . && git commit && git push'
    alias gituf='git add . && git commit -m "$(date +"%Y-%m-%d %T")" && git push'

    alias ta='tmux attach -t'
    alias tn='tmux new -s'
    alias tl='tmux ls'
    alias tk='tmux kill-session -t'

    alias zreload='clear && source $HOME/.zshrc'
    alias zrel='zreload'
    alias breload='clear && source $HOME/.bashrc'
    alias brel='breload'

    export WORKSPACE=/workspace
    [ -d /workspace ] && cd /workspace 2>/dev/null || true

    autoload -Uz compinit && compinit -C
    EOF
    chown boite:boite /home/boite/.zshrc
  - |
    cat > /home/boite/.tmux.conf << 'EOF'
    set -g default-terminal "screen-256color"
    set -ag terminal-overrides ",xterm-256color:RGB"
    set -g mouse on
    set -g default-shell /usr/bin/zsh
    set -g focus-events on
    set -g escape-time 0
    set -g history-limit 50000
    set-window-option -g mode-keys vi
    bind | split-window -h -c "#{pane_current_path}"
    bind - split-window -v -c "#{pane_current_path}"
    bind c new-window -c "#{pane_current_path}"
    bind h select-pane -L
    bind j select-pane -D
    bind k select-pane -U
    bind l select-pane -R
    bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
    EOF
    chown boite:boite /home/boite/.tmux.conf
  - mkdir -p /home/boite/.ssh
  - chown -R boite:boite /home/boite/.ssh
  - chmod 700 /home/boite/.ssh
  - test -f /home/boite/.ssh/authorized_keys && chmod 600 /home/boite/.ssh/authorized_keys
