#cloud-config
packages:
  - git
  - curl
  - unzip
  - ca-certificates
  - bash-completion
  - fzf
  - jq
  - tmux
  - wget
  - make
  - build-essential
  - zsh
  - neovim
  - starship
  - docker.io
users:
  - name: boite
    gecos: Boite
    groups: [sudo, docker]
    shell: /bin/zsh
    sudo: ALL=(ALL) NOPASSWD:ALL
    home: /home/boite
write_files:
  - path: /home/boite/.zshrc
    permissions: "0644"
    owner: boite:boite
    defer: true
    content: |
      #!/bin/zsh
      # Boite workspace shell config

      export PATH="/usr/local/go/bin:$HOME/.cargo/bin:/usr/local/bin:$HOME/.local/bin:$HOME/.bun/bin:/workspace/bin:$PATH"
      export WORKSPACE=/workspace

      if command -v mise >/dev/null 2>&1; then
        eval "$(mise activate zsh)"
      elif [ -x /usr/local/bin/mise ]; then
        eval "$(/usr/local/bin/mise activate zsh)"
      fi

      command -v starship >/dev/null 2>&1 && eval "$(starship init zsh)"

      alias ll='ls -la'
      alias la='ls -a'
      alias l='ls --color=auto'
      alias grep='grep --color=auto'
      alias c='clear'
      alias q='exit'
      alias :q='exit'
      alias ..='cd ..'
      alias ...='cd ../..'

      alias gs='git status'
      alias ga='git add'
      alias gc='git clone'
      alias gd='git diff'
      alias gb='git branch'
      alias gco='git checkout'

      alias ta='tmux attach -t'
      alias tn='tmux new -s'
      alias tl='tmux ls'

      autoload -Uz compinit && compinit -C
  - path: /home/boite/.tmux.conf
    permissions: "0644"
    owner: boite:boite
    defer: true
    content: |
      set -g default-terminal "screen-256color"
      set -ag terminal-overrides ",xterm-256color:RGB"
      set -g mouse on
      set -g default-shell /bin/zsh
      set -g focus-events on
      set -g escape-time 0
      set -g history-limit 50000
      set-window-option -g mode-keys vi
      bind | split-window -h -c "#{pane_current_path}"
      bind - split-window -v -c "#{pane_current_path}"
      bind c new-window -c "#{pane_current_path}"
      bind h select-pane -L
      bind j select-pane -D
      bind k select-pane -U
      bind l select-pane -R
      bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
runcmd:
  - rm -f /etc/legal /etc/motd
  - touch /home/boite/.hushlogin
  - usermod -s /bin/zsh boite
  - curl https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise sh
  - curl -L https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xzf -
  - su - boite -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
  - su - boite -c 'curl -fsSL https://bun.sh/install | bash'
  - su - boite -c 'curl -fsSL https://raw.githubusercontent.com/saravenpi/skatos/main/install.sh | bash'
  - su - boite -c 'git config --global init.defaultBranch main'
  - su - boite -c 'git config --global safe.directory "*"'
  - mkdir -p /workspace
  - chown -R boite:boite /workspace
  - mkdir -p /home/boite/.ssh
  - chown -R boite:boite /home/boite/.ssh
  - chmod 700 /home/boite/.ssh
  - test -f /home/boite/.ssh/authorized_keys && chmod 600 /home/boite/.ssh/authorized_keys

  # Fix mise/starship permission warnings on first login
  - su - boite -c 'mkdir -p ~/.local/share/mise/migrations ~/.cache/starship'
  - su - boite -c 'chown -R boite:boite ~/.local/share/mise ~/.cache/starship'

  # Fix starship lock icon (home dir permissions)
  - chown boite:boite /home/boite
  - chmod 750 /home/boite