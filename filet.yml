kind: cli

ignore:
  - .git
  - vendor
  - dist
  - build
  - testdata

extensions: [.go]

limits:
  fileLines: 300
  funcsPerFile: 0
  funcLines: 80
  funcStatements: 50
  lineLength: 120
  params: 5
  returns: 3
  nesting: 5
  complexity: 15

architecture:
  requiredDirs: [cmd]
  requiredFiles:
    "cmd": [root.go, ui.go, utils.go]

style:
  banInlineComments: true
  banTODO: true
  requireDocComments: false
  banGlobalMutable: false
  banInit: false
  banTrailingSpace: true

disabled:
  - gen.line.long
  - go.err.nilerr

failOn: error
