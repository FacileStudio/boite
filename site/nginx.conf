server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /base.qcow2 {
        alias /assets/boite.qcow2;
        add_header Content-Type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="boite.qcow2"';
    }

    location ~ ^/([a-zA-Z0-9_.-]+\.qcow2)$ {
        alias /assets/$1;
        add_header Content-Type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}