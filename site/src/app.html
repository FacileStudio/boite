<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A CLI that creates, manages and cleans up disposable QEMU virtual machines as isolated development sandboxes." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Facile" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://boite.facile.studio/" />
    <meta property="og:title" content="Boîte · Disposable VM sandboxes for development" />
    <meta property="og:description" content="A CLI that creates, manages and cleans up disposable QEMU virtual machines as isolated development sandboxes." />
    <meta property="og:image" content="https://boite.facile.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Boîte: Disposable VM sandboxes for development" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boîte · Disposable VM sandboxes for development" />
    <meta name="twitter:description" content="A CLI that creates, manages and cleans up disposable QEMU virtual machines as isolated development sandboxes." />
    <meta name="twitter:image" content="https://boite.facile.studio/og-image.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("boite-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.classList.add(theme);
      })();
    </script>
    <script>
      (function () {
        if (location.hostname !== 'boite.facile.studio') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://vision.facile.studio/s.js';
        s.setAttribute('data-mask', '');
        document.head.appendChild(s);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
